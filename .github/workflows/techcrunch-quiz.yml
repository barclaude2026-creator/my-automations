name: Daily TechCrunch AI Vocab Quiz

on:
  schedule:
    # 08:30 UTC daily (just after the AI digest at 08:00).
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser anthropic

      - name: Generate quizzes and email links
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          APP_URL: ${{ vars.APP_URL }}
        run: python scripts/techcrunch_quiz.py

      - name: Commit new quiz files
        run: |
          if [ -z "$(git status --porcelain vocab-app/quizzes)" ]; then
            echo "No new quiz files to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vocab-app/quizzes
          git commit -m "Add daily TechCrunch AI vocab quiz ($(date -u +%Y-%m-%d))"
          git push
